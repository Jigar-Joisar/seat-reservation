server:
  port: ${PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: 200
    max-connections: 20000
    accept-count: 4000
    connection-timeout: 60s
    # Keep idle connections open longer than any fronting proxy's idle timeout, so the proxy never reuses a
    # connection Tomcat has just closed (that race shows up as an empty reply / 520).
    keep-alive-timeout: 300s
    max-keep-alive-requests: -1

spring:
  application:
    name: seat-reservation
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  datasource:
    # DATABASE_URL accepts a JDBC URL (jdbc:h2:... / jdbc:postgresql://...) or a
    # postgres://user:pass@host:port/db string (Render/Heroku style) - see
    # PostgresUrlInitializer. Driver is detected from the URL.
    url: ${DATABASE_URL:jdbc:h2:file:./data/seats;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;LOCK_TIMEOUT=15000;WRITE_DELAY=0;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:32}
      minimum-idle: 8
      connection-timeout: 60000
      transaction-isolation: TRANSACTION_READ_COMMITTED
  sql:
    init:
      mode: always
  task:
    scheduling:
      # The hold sweeper can block for the full 60 s connection timeout during a database outage. It must not
      # share a thread with DbHealthMonitor, or the circuit breaker cannot open until the sweeper gives up.
      pool:
        size: 4
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me}
    ttl-seconds: 86400
  admin-secret: ${ADMIN_SECRET:dev-admin-secret}
  per-user-limit: ${PER_USER_LIMIT:4}
  max-seats-per-show: 100000
  hold-ttl-seconds: ${HOLD_TTL_SECONDS:300}
  hold-sweep-ms: ${HOLD_SWEEP_MS:5000}
  public-logs: ${PUBLIC_LOGS:true}
  db-probe-ms: ${DB_PROBE_MS:2000}
  # Advisory seat_taken hints (see cache/SeatHints). off = every request goes to the database.
  seat-hints:
    mode: ${SEAT_HINTS_MODE:local}
    max-entries: ${SEAT_HINTS_MAX:500000}
    ttl-seconds: ${SEAT_HINTS_TTL_SECONDS:60}

logging:
  level:
    root: INFO
