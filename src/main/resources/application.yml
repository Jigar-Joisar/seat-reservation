server:
  port: ${PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: 200
    max-connections: 20000
    accept-count: 4000
    connection-timeout: 60s

spring:
  application:
    name: seat-reservation
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/seats;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;LOCK_TIMEOUT=15000;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:32}
      minimum-idle: 8
      connection-timeout: 60000
      transaction-isolation: TRANSACTION_READ_COMMITTED
  sql:
    init:
      mode: always
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me}
    ttl-seconds: 86400
  admin-secret: ${ADMIN_SECRET:dev-admin-secret}
  per-user-limit: ${PER_USER_LIMIT:4}
  max-seats-per-show: 100000
  hold-ttl-seconds: ${HOLD_TTL_SECONDS:300}
  hold-sweep-ms: ${HOLD_SWEEP_MS:5000}

logging:
  level:
    root: INFO
