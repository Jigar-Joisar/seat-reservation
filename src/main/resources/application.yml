server:
  port: 8080

spring:
  application:
    name: seat-reservation

  datasource:
    url: jdbc:h2:file:./data/seats.db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: 20

  sql:
    init:
      mode: never

# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  health:
    db:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

# Application configuration
app:
  jwt:
    secret: ${JWT_SECRET:your-secret-key-change-in-production}
    expiration: 86400000  # 24 hours in milliseconds

  reservation:
    per-user-limit: ${PER_USER_LIMIT:4}
    hold-duration-minutes: ${HOLD_DURATION_MINUTES:5}

logging:
  level:
    com.seatreservation: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
