services:
  - type: web
    name: seat-reservation
    runtime: docker
    plan: free
    # Liveness, not readiness: Render takes an instance out of rotation after 15 s of failed checks and restarts it
    # after 60 s. With /health/ready a database outage would hide the app's own 503 + Retry-After behind Render's 502.
    healthCheckPath: /health/live
    envVars:
      # Render gives postgres://user:pass@host/db; the app converts it to JDBC.
      - key: DATABASE_URL
        fromDatabase:
          name: seat-reservation-db
          property: connectionString
      # The free Postgres is small; keep the pool modest so connections don't
      # starve it. Excess HTTP load queues on the pool, then 409s as contention.
      - key: DB_POOL_SIZE
        value: "16"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
      - key: PER_USER_LIMIT
        value: "4"

databases:
  - name: seat-reservation-db
    plan: free
    databaseName: seat_reservation
    user: seat_reservation
